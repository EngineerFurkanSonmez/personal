<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark background -->
  <rect width="32" height="32" fill="#070d14"/>
  <!-- Outer ring -->
  <circle cx="16" cy="16" r="14" stroke="#00d4ff" stroke-width="0.8" opacity="0.5"/>
  <!-- Inner ring -->
  <circle cx="16" cy="16" r="8" stroke="#00d4ff" stroke-width="0.6" opacity="0.4"/>
  <!-- Crosshair: top -->
  <line x1="16" y1="2" x2="16" y2="10" stroke="#00d4ff" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Crosshair: bottom -->
  <line x1="16" y1="22" x2="16" y2="30" stroke="#00d4ff" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Crosshair: left -->
  <line x1="2" y1="16" x2="10" y2="16" stroke="#00d4ff" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Crosshair: right -->
  <line x1="22" y1="16" x2="30" y2="16" stroke="#00d4ff" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="2.5" fill="#00d4ff" opacity="0.9"/>
  <!-- Corner ticks -->
  <path d="M4 8 L4 4 L8 4" stroke="#00d4ff" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <path d="M28 8 L28 4 L24 4" stroke="#00d4ff" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <path d="M4 24 L4 28 L8 28" stroke="#00d4ff" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <path d="M28 24 L28 28 L24 28" stroke="#00d4ff" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
</svg>
